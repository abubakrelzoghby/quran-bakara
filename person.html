<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدولي الشخصي - سورة البقرة</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>جدولي الشخصي</h1>
            <div id="current-week-info" class="week-info"></div>
            <div id="person-progress" class="person-progress"></div>
            
            <div class="person-buttons">
                <button class="person-btn person-maryam-btn" data-person="مريم">مريم</button>
                <button class="person-btn person-yahya-btn" data-person="يحيى">يحيى</button>
                <button class="person-btn person-ahmed-btn" data-person="أحمد">أحمد</button>
            </div>
            
            <a href="index.html" class="nav-link">العودة للجدول الكامل</a>
        </header>

        <main>
            <div id="person-schedule-container" class="single-person-schedule"></div>
        </main>
    </div>

    <!-- Modal for part details -->
    <div id="part-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="person.js"></script>
</body>
</html>
