<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة حفظ التقدم</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            direction: rtl;
        }
        .card {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 20px;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 15px;
            color: #555;
        }
        button {
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid #667eea;
            background: #667eea;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-block;
        }
        button:hover {
            background: #5563d6;
        }
        #result {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
        }
        .status-text {
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>تجربة حفظ التقدم بـ PHP + JSON</h1>
        <p>
            اضغط على الزر بالأسفل. كل ضغطة هتقلب قيمة مفتاح تجريبي
            <code>test_key</code> جوه الملف <code>progress.json</code>
            عن طريق السكريبت <code>toggle_test.php</code>.
        </p>
        <button id="toggle-btn">جرّب حفظ التقدم</button>
        <div id="status" class="status-text"></div>
        <div id="result"></div>
    </div>

    <script>
        const btn = document.getElementById('toggle-btn');
        const resultEl = document.getElementById('result');
        const statusEl = document.getElementById('status');

        btn.addEventListener('click', () => {
            statusEl.textContent = 'جاري الاتصال بالسكريبت...';
            fetch('toggle_test.php?key=test_key')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    statusEl.textContent = 'الحالة الحالية للمفتاح test_key: ' + data.value;
                    resultEl.textContent = JSON.stringify(data, null, 2);
                })
                .catch(err => {
                    statusEl.textContent = 'حدث خطأ في الاتصال بالسكريبت.';
                    resultEl.textContent = String(err);
                });
        });
    </script>
</body>
</html>
